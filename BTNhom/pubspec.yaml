name: grocery_store_management
description: "Grocery Store Management - Hệ thống quản lý cửa hàng tạp hóa"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4

  # UI / Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1

  # Charts
  fl_chart: ^0.69.0

  # Date/Time
  intl: ^0.19.0

  # PDF Export
  pdf: ^3.11.1
  printing: ^5.13.2
  path_provider: ^2.1.4
  share_plus: ^10.0.2

  # UUID Generation
  uuid: ^4.5.1

  # Shared Preferences (local settings)
  shared_preferences: ^2.3.3

  # Animations
  animate_do: ^3.3.4
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
